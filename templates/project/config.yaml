mode: project
scope:
  root: .
workspace:
  root: .
  read_paths:
    - .
  write_paths:
    - .
execution:
  profile: aggressive
targets:
  - id: local
    root: .
    read_paths:
      - .
    write_paths:
      - .
    capabilities:
      - fs.read
      - fs.write
      - git.status
      - git.branch
      - git.commit
      - repo.search
      - repo.test
      - repo.build
      - repo.check
      - repo.patch
      - http.fetch
capabilities:
  enabled:
    - fs.read
    - fs.write
    - git.status
    - git.branch
    - git.commit
    - repo.search
    - repo.test
    - repo.build
    - repo.check
    - repo.patch
    - http.fetch
policies:
  allow_tools:
    - fs.*
    - git.*
    - repo.*
    - http.fetch
  deny_patterns:
    - rm -rf
    - sudo
    - \.ssh
  require_approval:
    tools:
      - git.commit
      - shell.exec
    capabilities:
      - shell.exec
autonomy:
  mode: supervised
approvals:
  required_for:
    tools:
      - git.commit
      - shell.exec
    capabilities:
      - shell.exec
schedules: []
llm:
  provider: codex
  model: gpt-5-codex
  timeout_ms: 30000
  retry_count: 1
  temperature: 0
  executable: codex
http:
  allowlist:
    - example.com
server:
  host: 127.0.0.1
  port: 4310
worker:
  poll_interval_ms: 2000
maintenance:
  retention:
    keep_latest_artifacts: 100
    keep_latest_run_events: 200
    keep_latest_memory_entries: 200
    max_artifact_age_days: null
    max_run_event_age_days: null
    max_memory_entry_age_days: null
  cleanup:
    dry_run_default: false
    interval_seconds: null
limits:
  max_steps: 20
  max_runtime_sec: 120
  max_files_changed: 50
  max_iterations: 3
